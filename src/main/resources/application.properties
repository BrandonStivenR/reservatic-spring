# Nombre de la aplicación
spring.application.name=reservatic-spring

# Conexión a la base de datos MySQL (la misma de las evidencias anteriores)
spring.datasource.url=jdbc:mysql://localhost:3306/reservatic_db?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
# Solo local: escribe tu contraseña aquí. Antes de subir a GitHub déjala vacía.
spring.datasource.password= 

# "none": Hibernate NO modifica las tablas, usa las que ya existen
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true